<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>议案智能管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #root { width: 100%; min-height: 100%; margin: 0; }
    body { background: #f5f7fd; font-family: "Microsoft YaHei", Arial, sans-serif; }
    .startup-error { padding: 32px; color: #b42318; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>
  <script>
    (async function () {
      var root = document.getElementById("root");
      var parts = [
        "./assets/runtime-v3-01.js",
        "./assets/runtime-v3-02.js",
        "./assets/runtime-v3-03.js",
        "./assets/runtime-v3-04.js",
        "./assets/runtime-v3-05.js",
        "./assets/runtime-v3-06.js",
        "./assets/runtime-v3-07.js",
        "./assets/runtime-v3-08.js",
        "./assets/runtime-v3-09.js",
        "./assets/runtime-v3-10.js",
        "./assets/runtime-v3-11.js",
        "./assets/runtime-v3-12.js",
        "./assets/runtime-v3-13.js",
        "./assets/runtime-v3-14.js",
        "./assets/runtime-v3-15.js",
        "./assets/runtime-v3-16.js",
        "./assets/runtime-v3-17.js",
        "./assets/runtime-v3-18.js",
        "./assets/runtime-v3-19.js",
        "./assets/runtime-v3-20.js",
        "./assets/runtime-v3-21.js",
        "./assets/runtime-v3-22.js",
        "./assets/runtime-v3-23.js",
        "./assets/runtime-v3-24.js",
        "./assets/runtime-v3-25.js",
        "./assets/runtime-v3-26.js",
        "./assets/runtime-v3-27.js",
        "./assets/runtime-v3-28.js",
        "./assets/runtime-v3-29.js",
        "./assets/runtime-v3-30.js",
        "./assets/runtime-v3-31.js"
      ];
      try {
        var scripts = await Promise.all(parts.map(function (url) {
          return fetch(url).then(function (response) {
            if (!response.ok) throw new Error(url + " 加载失败（" + response.status + "）");
            return response.text();
          });
        }));
        (0, eval)(scripts.join(""));
        if (!window.UserComponent || !window.HtmlTemplateBootstrap) {
          throw new Error("应用组件初始化失败");
        }
        window.HtmlTemplateBootstrap.renderComponent(window.UserComponent);
      } catch (error) {
        console.error(error);
        root.className = "startup-error";
        root.textContent = "应用加载失败：" + error.message;
      }
    }());
  </script>
</body>
</html>
