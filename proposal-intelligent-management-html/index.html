<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>议案智能管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #root { width: 100%; min-height: 100%; margin: 0; }
    body { background: #f5f7fd; font-family: "Microsoft YaHei", Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>
  <script>
    (function () {
      var script = document.createElement("script");
      script.src = "./index.js";
      script.onload = function () {
        if (!window.UserComponent || !window.HtmlTemplateBootstrap) {
          throw new Error("导出资源加载失败");
        }
        window.HtmlTemplateBootstrap.renderComponent(window.UserComponent);
      };
      script.onerror = function () {
        document.getElementById("root").textContent = "应用脚本加载失败，请检查导出文件是否完整。";
      };
      document.body.appendChild(script);
    }());
  </script>
</body>
</html>
